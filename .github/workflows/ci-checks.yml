# Adopting this reusable workflow is a branch-protection change, not just a CI
# change: each job below reports as a status check named "{caller job} / {job}"
# (job ids joined by " / "), so update the default branch's required checks to
# those names in the same change that adopts it. See the README "Branch
# protection and reusable workflows" section for the exact check names.
name: CI Checks

on:
  workflow_call:
    inputs:
      runs-on:
        required: false
        type: string
        default: 'ubuntu-latest'
      working-directory:
        required: false
        type: string
        default: '.'
      setup:
        required: false
        type: string
        default: ''
      format:
        required: true
        type: string
      lint:
        required: true
        type: string
      build:
        required: true
        type: string
      test:
        required: true
        type: string
      build-artifact-paths:
        required: false
        type: string
        default: ''
    secrets:
      github-token:
        required: false

jobs:
  format:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - if: inputs.setup != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.setup }}
      - working-directory: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
        run: ${{ inputs.format }}

  lint:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - if: inputs.setup != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.setup }}
      - working-directory: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
        run: ${{ inputs.lint }}

  build:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - if: inputs.setup != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.setup }}
      - working-directory: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
        run: ${{ inputs.build }}
      - if: inputs.build-artifact-paths != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compiled-output
          path: ${{ inputs.build-artifact-paths }}

  test:
    needs: [build]
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - if: inputs.build-artifact-paths != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: compiled-output
      - if: inputs.setup != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.setup }}
      - working-directory: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
        run: ${{ inputs.test }}
