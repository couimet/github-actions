name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-test:
    name: Self-test composite actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify action coverage
        run: make check-actions

      - name: Setup Node.js & pnpm
        id: setup
        uses: ./setup-node-pnpm
        with:
          working-directory: tests

      - name: Install dependencies
        id: install
        uses: ./install-deps
        with:
          working-directory: tests

      - name: Verify resolved versions match fixture
        shell: bash
        env:
          NODE_VERSION_OUTPUT: ${{ steps.setup.outputs.node-version }}
          PNPM_VERSION_OUTPUT: ${{ steps.setup.outputs.pnpm-version }}
          CACHE_HIT: ${{ steps.install.outputs.cache-hit }}
        run: bash ./scripts/verify-versions.sh

      - name: Lint markdown
        uses: ./markdownlint

      - name: Create markdown lint fixture
        shell: bash
        run: mkdir -p fix-test && printf '# Heading with trailing spaces\x20\x20\x20\n\n\n' > fix-test/bad.md

      - name: Test markdownlint fix mode
        uses: ./markdownlint
        with:
          mode: fix
          paths: fix-test/**/*.md

      - name: Verify fixed markdown passes lint
        uses: ./markdownlint
        with:
          paths: fix-test/**/*.md

      - name: Remove markdown lint fixture
        shell: bash
        run: rm -rf fix-test

      # $RUNNER_TEMP/mdl-fallback has no .markdownlint*, so these steps prove the
      # bundled @couimet/markdownlint-config zero-config fallback (MD060 "aligned")
      # is live: aligned.md must pass and bad.md must fail on MD060, which the
      # built-in defaults (MD060 "any") would never report. The repo root covers
      # auto-discovery of the repo's own config via the Lint markdown step above.
      - name: Create zero-config fallback fixture
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mdl-fallback"
          printf '# Aligned\n\n| a    | b    |\n| ---- | ---- |\n| long | val  |\n' > "$RUNNER_TEMP/mdl-fallback/aligned.md"
          printf '# Misaligned\n\n| a | b |\n| --- | --- |\n| longer | y |\n' > "$RUNNER_TEMP/mdl-fallback/bad.md"

      - name: Test zero-config fallback (aligned table passes)
        uses: ./markdownlint
        with:
          working-directory: ${{ runner.temp }}/mdl-fallback
          paths: aligned.md

      - name: Test zero-config fallback (misaligned table fails)
        id: mdl-fallback-bad
        uses: ./markdownlint
        continue-on-error: true
        with:
          working-directory: ${{ runner.temp }}/mdl-fallback
          paths: bad.md

      - name: Assert zero-config fallback rejected the misaligned table
        shell: bash
        run: |
          if [[ "${{ steps.mdl-fallback-bad.outcome }}" != "failure" ]]; then
            echo "expected MD060 aligned check to fail on the misaligned table, got: ${{ steps.mdl-fallback-bad.outcome }}" >&2
            exit 1
          fi

      - name: Remove zero-config fallback fixture
        shell: bash
        run: rm -rf "$RUNNER_TEMP/mdl-fallback"

      - name: Check formatting
        uses: ./prettier

      - name: Prepare misformatted fixture for fix-mode self-test
        shell: bash
        run: cp tests/fixtures/format-bad.js /tmp/test-fix.js

      # /tmp has no .prettierrc*, so these two steps exercise the bundled
      # canonical config fallback; the repo root covers auto-discovery.
      - name: Fix formatting (prettier fix mode)
        uses: ./prettier
        with:
          mode: fix
          config: ''
          working-directory: /tmp
          paths: /tmp/test-fix.js

      - name: Verify prettier fix-mode result
        uses: ./prettier
        with:
          working-directory: /tmp
          paths: /tmp/test-fix.js

      - name: Validate links
        uses: ./validate-links

      - name: Lint shell scripts
        uses: ./shellcheck

      - name: Test format action
        uses: ./format
        with:
          working-directory: tests

      - name: Test lint action
        uses: ./lint
        with:
          working-directory: tests

      - name: Test build action
        uses: ./build
        with:
          working-directory: tests

      - name: Test test action
        uses: ./test
        with:
          working-directory: tests

      - name: Upload coverage to Codecov (TypeScript)
        uses: ./codecov-typescript-upload
        with:
          working-directory: tests

      - name: Upload coverage to Codecov (generic)
        uses: ./codecov-upload
        with:
          files: coverage/lcov.info
          working-directory: tests

      - name: Test guard-versions action
        uses: ./guard-versions
        with:
          working-directory: tests
          base-ref: HEAD
          head-ref: HEAD

      - name: Test typescript-ci action
        uses: ./typescript-ci
        with:
          working-directory: tests
          guard-versions: false

      - name: Test validate-yaml action
        uses: ./validate-yaml
        with:
          schema: validate-yaml/tests/fixtures/valid.schema.json
          file: validate-yaml/tests/fixtures/valid.yml

      - name: Test check-no-prerelease-deps action
        uses: ./check-no-prerelease-deps
        with:
          working-directory: tests

      - name: Test publish-pr-comment action
        if: github.event_name == 'pull_request'
        uses: ./publish-pr-comment
        with:
          github-token: ${{ github.token }}
          header: publish-pr-comment-self-test
          comment-file: tests/fixtures/comment-body.md

      - name: Test auto-fix action (no-op fix command)
        uses: ./auto-fix
        with:
          fix-command: 'true'

      - name: Test detect-auto-fix-commit action
        uses: ./detect-auto-fix-commit
        with:
          commit-message: 'chore: auto-fix [skip ci]'

      - name: Test check-todos action
        uses: ./check-todos
        with:
          path: tests
          github-token: ${{ github.token }}

      - name: Test check-generated-drift action
        uses: ./check-generated-drift
        with:
          command: 'true'
          github-token: ${{ github.token }}

      - name: Test coverage-comment action
        if: github.event_name == 'pull_request'
        uses: ./coverage-comment
        with:
          github-token: ${{ github.token }}
          working-directory: tests
          coverage-summary-path: coverage/coverage-summary.json

      - name: Run shell tests (BATS)
        uses: ./bats-test
        with:
          test-directory: bats-tests/shell
          github-token: ${{ github.token }}

  self-test-checks:
    name: Self-test typescript-ci-checks workflow
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/typescript-ci-checks.yml
    with:
      working-directory: tests
      guard-versions: true
      build-artifact-paths: ''

  self-test-shell-ci-checks:
    name: Self-test shell-ci-checks workflow
    permissions:
      contents: read
    uses: ./.github/workflows/shell-ci-checks.yml
    with:
      # The dedicated BATS step above already posts the sticky test-results
      # comment; skip it here so the two runs do not fight over the same header.
      publish-comment: 'false'

  self-test-ci-checks:
    name: Self-test ci-checks workflow
    permissions:
      contents: read
    uses: ./.github/workflows/ci-checks.yml
    with:
      setup: 'echo "toolchain ready"'
      format: 'echo "format passed"'
      lint: 'echo "lint passed"'
      build: 'echo "build passed"'
      test: 'echo "test passed"'

  self-test-rabbit-maximizer-restacker:
    name: Self-test rabbit-maximizer-restacker workflow
    permissions:
      pull-requests: write
    uses: ./.github/workflows/rabbit-maximizer-restacker.yml
