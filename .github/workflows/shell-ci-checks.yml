# Adopting this reusable workflow is a branch-protection change, not just a CI
# change: each job below reports as a status check named "{caller job} / {job}"
# (job ids joined by " / "), so update the default branch's required checks to
# those names in the same change that adopts it. See the README "Branch
# protection and reusable workflows" section for the exact check names.
name: Shell CI Checks

on:
  workflow_call:
    inputs:
      paths:
        required: false
        type: string
        default: '.'
      extensions:
        required: false
        type: string
        default: 'sh bash'
      exclude:
        required: false
        type: string
        default: '.claude-work .history node_modules .git'
      severity:
        required: false
        type: string
        default: ''
      shellcheck-timeout-minutes:
        required: false
        type: number
        default: 360
      # Free-form command run before the suite in both jobs that execute it, so
      # a consumer can provision the tools its tests shell out to. Those tools
      # belong to the consumer, not to this workflow, which is why the command
      # arrives as an input rather than as a step here. The shellcheck job reads
      # files and needs nothing, so it runs no setup.
      setup:
        required: false
        type: string
        default: ''
      test-directory:
        required: false
        type: string
        default: 'bats-tests/'
      bats-version:
        required: false
        type: string
        default: '1.14.0'
      # Booleans, for the reason spelled out on publish-comment below. These
      # relay to composite actions, whose inputs are strings by construction, so
      # mirroring that typing here is the tempting move; it is also the one that
      # rejects a bare boolean at the call site. The composite action still
      # receives "true"/"false" through the expression, which is what the .sh
      # scripts compare against.
      recursive:
        required: false
        type: boolean
        default: true
      support-install:
        required: false
        type: boolean
        default: true
      assert-install:
        required: false
        type: boolean
        default: true
      detik-install:
        required: false
        type: boolean
        default: false
      file-install:
        required: false
        type: boolean
        default: false
      formatter:
        required: false
        type: string
        default: ''
      # Boolean, not string: a string input rejects a bare `false` from the
      # caller and fails the whole workflow file, so no job starts.
      publish-comment:
        required: false
        type: boolean
        default: true
      comment-header:
        required: false
        type: string
        default: 'BATS Test Results'
      bats-test-timeout-minutes:
        required: false
        type: number
        default: 360
      # Shell coverage is opt-in, and off by default: its first run in a
      # repository builds kcov from source, so a consumer pays for it only after
      # asking for it.
      run-coverage:
        required: false
        type: boolean
        default: false
      coverage-exclude-pattern:
        required: false
        type: string
        default: 'bats-tests/,coverage/,.git/,.history/,node_modules/,\.claude-work/'
      # Relayed so that a consumer can tune the markers or turn them off without
      # calling the composite action directly. The defaults are the marker
      # convention itself, so a consumer that annotates nothing needs no edit.
      coverage-exclude-region:
        required: false
        type: string
        default: 'kcov-exclude-start:kcov-exclude-end'
      coverage-exclude-line:
        required: false
        type: string
        default: 'kcov-exclude-line'
      coverage-outdir:
        required: false
        type: string
        default: 'coverage/'
      coverage-flag:
        required: false
        type: string
        default: 'shell'
      coverage-timeout-minutes:
        required: false
        type: number
        default: 360

    secrets:
      codecov-token:
        required: false
        description: 'Codecov upload token. Required for the coverage job to upload from a private repository or from a fork pull request.'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.shellcheck-timeout-minutes) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: couimet/github-actions/shellcheck@main
        with:
          paths: ${{ inputs.paths }}
          extensions: ${{ inputs.extensions }}
          exclude: ${{ inputs.exclude }}
          severity: ${{ inputs.severity }}

  bats-test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.bats-test-timeout-minutes) }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - if: inputs.setup != ''
        shell: bash
        run: ${{ inputs.setup }}
      - uses: couimet/github-actions/bats-test@main
        with:
          test-directory: ${{ inputs.test-directory }}
          bats-version: ${{ inputs.bats-version }}
          recursive: ${{ inputs.recursive }}
          support-install: ${{ inputs.support-install }}
          assert-install: ${{ inputs.assert-install }}
          detik-install: ${{ inputs.detik-install }}
          file-install: ${{ inputs.file-install }}
          formatter: ${{ inputs.formatter }}
          # Fork PRs get a read-only GITHUB_TOKEN, so the sticky comment would
          # fail with "Resource not accessible by integration"; skip it there.
          publish-comment: ${{ github.event.pull_request.head.repo.fork != true && inputs.publish-comment }}
          comment-header: ${{ inputs.comment-header }}
          github-token: ${{ github.token }}

  coverage:
    # Off unless the caller opts in, so the reusable workflow stays cheap for a
    # repository that only wants shellcheck and BATS.
    if: inputs.run-coverage
    # Pinned rather than ubuntu-latest: kcov is not packaged for 24.04 and is
    # built from source, so the image version decides which packages exist.
    runs-on: ubuntu-24.04
    # The kcov source build dominates a cold run. The cache inside the
    # shell-coverage action removes it from most runs, but the first run of a
    # repository and every run after a key change are cold.
    timeout-minutes: ${{ fromJSON(inputs.coverage-timeout-minutes) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The same setup the bats-test job runs: both jobs execute the suite, so
      # both need whatever it shells out to.
      - if: inputs.setup != ''
        shell: bash
        run: ${{ inputs.setup }}
      # The BATS inputs are relayed rather than defaulted so that the coverage
      # job measures the suite the bats-test job runs. A consumer that sets
      # test-directory for one job and not the other would otherwise get two
      # different suites.
      - uses: couimet/github-actions/shell-coverage@main
        id: coverage
        with:
          test-directory: ${{ inputs.test-directory }}
          bats-version: ${{ inputs.bats-version }}
          recursive: ${{ inputs.recursive }}
          support-install: ${{ inputs.support-install }}
          assert-install: ${{ inputs.assert-install }}
          detik-install: ${{ inputs.detik-install }}
          file-install: ${{ inputs.file-install }}
          exclude-pattern: ${{ inputs.coverage-exclude-pattern }}
          exclude-region: ${{ inputs.coverage-exclude-region }}
          exclude-line: ${{ inputs.coverage-exclude-line }}
          outdir: ${{ inputs.coverage-outdir }}
      # Failing the step is safe on a push and disruptive on a pull request: a
      # Codecov outage or token problem has no bearing on the change under
      # review, and a fork PR carries no token at all.
      - uses: couimet/github-actions/codecov-upload@main
        with:
          files: ${{ steps.coverage.outputs.report-path }}
          flags: ${{ inputs.coverage-flag }}
          token: ${{ secrets.codecov-token }}
          fail-ci-if-error: ${{ github.event_name == 'push' }}
