# Adopting this reusable workflow is a branch-protection change, not just a CI
# change: each job below reports as a status check named "{caller job} / {job}"
# (job ids joined by " / "), so update the default branch's required checks to
# those names in the same change that adopts it. See the README "Branch
# protection and reusable workflows" section for the exact check names.
name: Shell CI Checks

on:
  workflow_call:
    inputs:
      paths:
        required: false
        type: string
        default: '.'
      extensions:
        required: false
        type: string
        default: 'sh bash'
      exclude:
        required: false
        type: string
        default: '.claude-work .history node_modules .git'
      severity:
        required: false
        type: string
        default: ''
      shellcheck-timeout-minutes:
        required: false
        type: number
        default: 360
      test-directory:
        required: false
        type: string
        default: 'bats-tests/'
      bats-version:
        required: false
        type: string
        default: '1.14.0'
      recursive:
        required: false
        type: string
        default: 'true'
      support-install:
        required: false
        type: string
        default: 'true'
      assert-install:
        required: false
        type: string
        default: 'true'
      detik-install:
        required: false
        type: string
        default: 'false'
      file-install:
        required: false
        type: string
        default: 'false'
      formatter:
        required: false
        type: string
        default: ''
      publish-comment:
        required: false
        type: string
        default: 'true'
      comment-header:
        required: false
        type: string
        default: 'BATS Test Results'
      bats-test-timeout-minutes:
        required: false
        type: number
        default: 360

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.shellcheck-timeout-minutes) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: couimet/github-actions/shellcheck@main
        with:
          paths: ${{ inputs.paths }}
          extensions: ${{ inputs.extensions }}
          exclude: ${{ inputs.exclude }}
          severity: ${{ inputs.severity }}

  bats-test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.bats-test-timeout-minutes) }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: couimet/github-actions/bats-test@main
        with:
          test-directory: ${{ inputs.test-directory }}
          bats-version: ${{ inputs.bats-version }}
          recursive: ${{ inputs.recursive }}
          support-install: ${{ inputs.support-install }}
          assert-install: ${{ inputs.assert-install }}
          detik-install: ${{ inputs.detik-install }}
          file-install: ${{ inputs.file-install }}
          formatter: ${{ inputs.formatter }}
          # Fork PRs get a read-only GITHUB_TOKEN, so the sticky comment would
          # fail with "Resource not accessible by integration"; skip it there.
          publish-comment: ${{ github.event.pull_request.head.repo.fork == true && 'false' || inputs.publish-comment }}
          comment-header: ${{ inputs.comment-header }}
          github-token: ${{ github.token }}
