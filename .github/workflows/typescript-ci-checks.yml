name: TypeScript CI Checks

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: '.'
      node-version:
        required: false
        type: string
        default: ''
      format-command:
        required: false
        type: string
        default: 'pnpm format'
      lint-command:
        required: false
        type: string
        default: 'pnpm lint'
      markdownlint:
        required: false
        type: boolean
        default: true
      build-command:
        required: false
        type: string
        default: 'pnpm build'
      build-artifact-paths:
        required: false
        type: string
        default: 'packages/*/out/'
      pre-install-command:
        required: false
        type: string
        default: ''
      test-command:
        required: false
        type: string
        default: 'pnpm test'
      guard-versions:
        required: false
        type: boolean
        default: true
      check-no-prerelease-deps:
        required: false
        type: boolean
        default: true
      check-todos:
        required: false
        type: boolean
        default: true
      coverage-comment:
        required: false
        type: boolean
        default: true
      codecov-upload:
        required: false
        type: boolean
        default: true
      codecov-files:
        required: false
        type: string
        default: 'coverage/lcov.info'
      codecov-token:
        required: false
        type: string
        default: ''
      codecov-per-package-flags:
        required: false
        type: boolean
        default: false
      codecov-per-package-flags-base:
        required: false
        type: string
        default: 'packages'
      codecov-per-package-flags-pattern:
        required: false
        type: string
        default: ''
      auto-fix-command:
        required: false
        type: string
        default: ''
      auto-fix-commit-message:
        required: false
        type: string
        default: 'chore: auto-fix [skip ci]'

    secrets:
      auto-fix-token:
        required: false
        description: 'Optional PAT or GitHub App token for the auto-fix push. When set, the fix commit can trigger a fresh CI run on the fixed SHA; pair with an auto-fix-commit-message that omits [skip ci].'
      codecov-token:
        required: false
        description: 'Codecov upload token. Preferred path for passing secrets.CODECOV_TOKEN. Falls back to the input of the same name for backward compatibility.'

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: couimet/github-actions/setup-node-pnpm@main
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
      - if: inputs.pre-install-command != ''
        run: ${{ inputs.pre-install-command }}
      - uses: couimet/github-actions/install-deps@main
        with:
          working-directory: ${{ inputs.working-directory }}
      - uses: couimet/github-actions/format@main
        with:
          command: ${{ inputs.format-command }}
          working-directory: ${{ inputs.working-directory }}

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - *checkout
      - uses: couimet/github-actions/setup-node-pnpm@main
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
      - if: inputs.pre-install-command != ''
        run: ${{ inputs.pre-install-command }}
      - uses: couimet/github-actions/install-deps@main
        with:
          working-directory: ${{ inputs.working-directory }}
      - uses: couimet/github-actions/lint@main
        with:
          command: ${{ inputs.lint-command }}
          working-directory: ${{ inputs.working-directory }}

  markdownlint:
    if: inputs.markdownlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - *checkout
      - uses: couimet/github-actions/markdownlint@main
        with:
          working-directory: ${{ inputs.working-directory }}

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - *checkout
      - uses: couimet/github-actions/setup-node-pnpm@main
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
      - if: inputs.pre-install-command != ''
        run: ${{ inputs.pre-install-command }}
      - uses: couimet/github-actions/install-deps@main
        with:
          working-directory: ${{ inputs.working-directory }}
      - uses: couimet/github-actions/build@main
        with:
          command: ${{ inputs.build-command }}
          working-directory: ${{ inputs.working-directory }}
      - if: inputs.build-artifact-paths != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compiled-output
          path: ${{ inputs.build-artifact-paths }}

  test:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - *checkout
      - uses: couimet/github-actions/setup-node-pnpm@main
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
      - if: inputs.build-artifact-paths != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: compiled-output
      - if: inputs.pre-install-command != ''
        run: ${{ inputs.pre-install-command }}
      - uses: couimet/github-actions/install-deps@main
        with:
          working-directory: ${{ inputs.working-directory }}
      - uses: couimet/github-actions/test@main
        with:
          command: ${{ inputs.test-command }}
          working-directory: ${{ inputs.working-directory }}
      - if: inputs.coverage-comment && github.event_name == 'pull_request'
        uses: couimet/github-actions/coverage-comment@main
        with:
          github-token: ${{ github.token }}
          working-directory: ${{ inputs.working-directory }}

      - if: inputs.codecov-upload
        uses: couimet/github-actions/codecov-typescript-upload@main
        with:
          files: ${{ inputs.codecov-files }}
          working-directory: ${{ inputs.working-directory }}
          token: ${{ secrets.codecov-token || inputs.codecov-token }}
          per-package-flags: ${{ inputs.codecov-per-package-flags }}
          per-package-flags-base: ${{ inputs.codecov-per-package-flags-base }}
          per-package-flags-pattern: ${{ inputs.codecov-per-package-flags-pattern }}

  guard-versions:
    if: inputs.guard-versions && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - &checkout-depth-0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: couimet/github-actions/guard-versions@main
        with:
          working-directory: ${{ inputs.working-directory }}

  check-no-prerelease-deps:
    if: inputs.check-no-prerelease-deps
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - *checkout
      - uses: couimet/github-actions/check-no-prerelease-deps@main
        with:
          working-directory: ${{ inputs.working-directory }}

  check-todos:
    if: inputs.check-todos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - *checkout-depth-0
      - uses: couimet/github-actions/check-todos@main
        with:
          path: ${{ inputs.working-directory }}
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          github-token: ${{ github.token }}

  auto-fix:
    needs: [format, lint]
    if: ${{ !cancelled() && inputs.auto-fix-command != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.auto-fix-token || github.token }}
      - name: Detect auto-fix commit
        id: guard
        env:
          AUTO_FIX_COMMIT_MESSAGE: ${{ inputs.auto-fix-commit-message }}
        run: 'echo "is-auto-fix=$(test "$(git log -1 --format=%s)" = "$AUTO_FIX_COMMIT_MESSAGE" && echo true || echo false)" >> "$GITHUB_OUTPUT"'
      - if: steps.guard.outputs.is-auto-fix != 'true'
        uses: couimet/github-actions/setup-node-pnpm@main
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
      - if: steps.guard.outputs.is-auto-fix != 'true' && inputs.pre-install-command != ''
        run: ${{ inputs.pre-install-command }}
      - if: steps.guard.outputs.is-auto-fix != 'true'
        uses: couimet/github-actions/install-deps@main
        with:
          working-directory: ${{ inputs.working-directory }}
      - if: steps.guard.outputs.is-auto-fix != 'true'
        uses: couimet/github-actions/auto-fix@main
        with:
          fix-command: ${{ inputs.auto-fix-command }}
          working-directory: ${{ inputs.working-directory }}
          commit-message: ${{ inputs.auto-fix-commit-message }}
