name: 'Run Prettier'
description: 'Installs Prettier at a pinned version via npm and checks (or fixes) formatting against the consuming repo .prettierrc* / .prettierignore.'
inputs:
  config:
    description: 'Path passed as --config. When empty, Prettier auto-discovers .prettierrc* in the consuming repo.'
    required: false
    default: ''
  mode:
    description: "'check' runs prettier --check (read-only, the default); 'fix' runs prettier --write to auto-fix formatting."
    required: false
    default: 'check'
  paths:
    description: 'Path(s) passed to prettier; the consuming repo .prettierignore governs exclusions.'
    required: false
    default: '.'
  prettier-version:
    description: 'Version of the prettier npm package to install. When empty, uses the version from the local package.json (Dependabot-tracked). Set to override.'
    required: false
    default: ''
  working-directory:
    description: 'Directory to run Prettier in. Set when the target lives in a subdirectory.'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Install Prettier
      shell: bash
      env:
        PRETTIER_VERSION: ${{ inputs.prettier-version }}
      run: bash "${{ github.action_path }}/install.sh"

    - name: Run Prettier
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        CONFIG: ${{ inputs.config }}
        PATHS: ${{ inputs.paths }}
      run: bash "${{ github.action_path }}/lint.sh"
