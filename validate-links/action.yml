name: 'Validate links'
description: 'Fails the step when a link is broken; excludes private, link-local, and loopback targets from checking and, on pull requests, reports them in a comment when a github-token is supplied.'
inputs:
  lychee-version:
    description: 'Version of the lychee link checker to install, in vX.Y.Z or X.Y.Z form. The default is the pinned LYCHEE_VERSION in versions.mk.'
    required: false
    default: '0.24.2'
  paths:
    description: 'Space-separated paths or globs to check. Globs are resolved by the checker, not shell-expanded.'
    required: false
    default: '**/*.md'
  working-directory:
    description: 'Directory to run the check in. Set when the target lives in a subdirectory.'
    required: false
    default: '.'
  github-token:
    description: 'GitHub token for posting a PR comment listing private, link-local, or loopback targets that were excluded from checking. Pass secrets.GITHUB_TOKEN from the consuming workflow.'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install lychee
      shell: bash
      env:
        LYCHEE_VERSION: ${{ inputs.lychee-version }}
      run: bash "${{ github.action_path }}/install.sh"

    - name: Validate links
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: bash "${{ github.action_path }}/run.sh"

    - name: Report excluded private targets
      id: private-report
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: bash "${{ github.action_path }}/report-private.sh"

    - name: Post PR comment with excluded private targets
      if: steps.private-report.outputs.comment-file != '' && inputs.github-token != '' && github.event.pull_request != null
      uses: couimet/github-actions/publish-pr-comment@main
      with:
        comment-file: ${{ steps.private-report.outputs.comment-file }}
        github-token: ${{ inputs.github-token }}
        header: validate-links private-target report
