name: 'Run markdownlint'
description: 'Installs markdownlint-cli2 at a pinned version via npm and lints (or auto-fixes with --fix in fix mode) Markdown files against a configurable glob and config file. In fix mode the action registers the custom rule markdownlint-rule-force-align-table-columns (MD060A) when the effective config is an eligible JSON or JSONC file. JS-module (CJS/MJS) configs, unparseable configs, and unresolved-rule fallbacks do not register it. Eligible configs that extend @couimet/markdownlint-config get table auto-alignment without listing customRules. The version pin gives exact parity with a local `npm install -g markdownlint-cli2@<version>`.'
inputs:
  config:
    # Empty default triggers auto-discovery rather than hardcoding a filename —
    # this works for repos with any config name, including split configs.
    description: 'Path to a markdownlint-cli2 config file passed as --config. When empty, auto-discovers all config files at the repo root (supports split configs). In fix mode the action writes a temporary effective config that registers markdownlint-rule-force-align-table-columns when the selected config is JSON or JSONC, then passes that via --config. JS-module configs, unparseable configs, and unresolved-rule fallbacks do not register the rule.'
    required: false
    default: ''
  markdownlint-version:
    description: 'Version of the markdownlint-cli2 npm package to install. When empty, uses the version from the local package.json (Dependabot-tracked). Set to override.'
    required: false
    default: ''
  mode:
    description: 'Mode to run: check performs a read-only lint (the default), fix auto-fixes issues with markdownlint-cli2 --fix.'
    required: false
    default: 'check'
  paths:
    description: 'Space-separated glob(s) of Markdown files to lint.'
    required: false
    default: '**/*.md'
  working-directory:
    description: 'Directory to run markdownlint in. Set when the target lives in a subdirectory.'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Install markdownlint-cli2
      shell: bash
      env:
        MARKDOWNLINT_VERSION: ${{ inputs.markdownlint-version }}
      run: bash "${{ github.action_path }}/install.sh"

    - name: Run markdownlint
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        CONFIG: ${{ inputs.config }}
        PATHS: ${{ inputs.paths }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: bash "${{ github.action_path }}/lint.sh"
